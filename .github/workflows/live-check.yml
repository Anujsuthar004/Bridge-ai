name: Live site check

# Daily check that BridgeAI still works on the real Gemini site. ChatGPT and Claude block automated
# signed-out browsers, so they are covered by the weekly check in a signed-in Chrome instead.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - tests/live.mjs
      - .github/workflows/live-check.yml
      - adapters/GeminiAdapter.ts
      - lib/insertText.ts

permissions:
  contents: read
  issues: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check BridgeAI on gemini.google.com
        run: npm run test:live

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check
          path: test-results/
          if-no-files-found: ignore

      # Scheduled failures open an issue, or comment on the open one, so a breakage gets noticed.
      - name: Report failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label live-check \
              --title "Live check failed on Gemini" \
              --body "The daily live check could not use BridgeAI on gemini.google.com. Screenshots are attached to the run: $RUN_URL"
          fi
